name: Build Nexa LinkedIn Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Signed Release APK
      run: |
        gradle assembleRelease --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/app-release.apk release-apk/NexaAssistant.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexaAssistant-APK
        path: release-apk/NexaAssistant.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.7
        name: Nexa Assistant v1.0.7 (24/7 MIUI Keep-Alive, Anti-Crash Guard & 1.6s Cloud Engine)
        body: |
          ### ⚡ Nexa LinkedIn Assistant APK (v1.0.7)
          Download and install `NexaAssistant.apk` directly on your Android mobile.
          - **Zero Laptop Dependency**: 100% Cloud-powered on Vercel (`gemini-3.5-flash` primary engine with 1.6s response time)
          - **MIUI / HyperOS Keep-Alive**: Foreground service notification + `stopWithTask="false"` + 1-click Battery Saver exemption so the phone never kills or marks the service as malfunctioning overnight
          - **Crash-Proof Accessibility Guard**: Global exception shield prevents Android from disabling the service in Downloaded Apps
          - **Auto-Retry Network Layer**: Automatically retries transient mobile network blips
        files: release-apk/NexaAssistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
