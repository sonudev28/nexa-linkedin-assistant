name: Build Nexa LinkedIn Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Signed Release APK
      run: |
        gradle assembleRelease --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/app-release.apk release-apk/NexaAssistant.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexaAssistant-APK
        path: release-apk/NexaAssistant.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.6
        name: Nexa Assistant v1.0.6 (Visual Thinking State & Clean Human Replies)
        body: |
          ### ⚡ Nexa LinkedIn Assistant APK (v1.0.6)
          Download and install `NexaAssistant.apk` directly on your Android mobile.
          - Instant visual thinking indicator (`⏳` Amber glow) when tapped
          - Zero robotic bullet dashes; 100% human conversational sentences
          - Deep multi-turn conversation history extraction
          - 24/7 Cloud Brain integration (Vercel Serverless)
        files: release-apk/NexaAssistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
