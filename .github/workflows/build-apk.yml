name: Build Nexa LinkedIn Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build Signed Release APK
      run: |
        gradle assembleRelease --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/release/app-release.apk release-apk/NexaAssistant.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexaAssistant-APK
        path: release-apk/NexaAssistant.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.8
        name: "Nexa Assistant v1.0.8 (Anti-Swipe-Kill Shield - Survives Recent Apps Clear)"
        body: |
          ### ⚡ Nexa LinkedIn Assistant APK (v1.0.8)
          Download and install `NexaAssistant.apk` directly on your Android mobile.
          - **Anti-Swipe-Kill Shield (`excludeFromRecents="true"` + `taskAffinity=""`)**: Clearing background apps (Recent Apps tray) will NO LONGER kill the floating bot icon!
          - **Android 14 Protected Foreground Service (`specialUse` + `START_STICKY` + `onTaskRemoved`)**: Keeps the bot running 24/7 even when all apps are closed.
          - **Zero Laptop Dependency**: 100% Cloud-powered on Vercel with 6-model high-quota pool + Zero-500 fallback.
        files: release-apk/NexaAssistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
