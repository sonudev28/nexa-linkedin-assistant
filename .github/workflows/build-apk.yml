name: Build Nexa LinkedIn Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      run: |
        chmod +x gradlew || gradle wrapper
        ./gradlew assembleDebug --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release-apk
        cp app/build/outputs/apk/debug/app-debug.apk release-apk/NexaAssistant.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexaAssistant-APK
        path: release-apk/NexaAssistant.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Nexa Assistant v1.0.0
        body: |
          ### ⚡ Nexa LinkedIn Assistant APK
          Download and install `NexaAssistant.apk` directly on your Android mobile.
          - 24/7 Cloud Brain integration (Vercel Serverless)
          - Floating overlay button for LinkedIn
          - 1-Click Context-aware replies & auto-copy
        files: release-apk/NexaAssistant.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
